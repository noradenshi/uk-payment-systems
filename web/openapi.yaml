          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                frequency:
                  type: string
      responses:
        "200":
          description: Mandate amended
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: cancelMandate
      summary: Cancel a mandate
      tags: [BACS Mandates]
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Mandate cancelled
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/payments/bacs/mandates/{ref}/claim:
    post:
      operationId: claimMandate
      summary: Claim a mandate
      description: Links a payer account to an AUDDIS mandate.
      tags: [BACS Mandates]
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payer_sort_code:
                  type: string
                payer_account:
                  type: string
      responses:
        "200":
          description: Mandate claimed
        "404":
          $ref: "#/components/responses/NotFound"

  # ─────────────────────────────────────────────
  # BACS — Returns & Rejects
  # ─────────────────────────────────────────────
  /v1/payments/bacs/returns:
    get:
      operationId: listBacsReturns
