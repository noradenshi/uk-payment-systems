  # BACS — Cycles
  # ─────────────────────────────────────────────
  /v1/payments/bacs/cycle/current:
    get:
      operationId: getCurrentBacsCycle
      summary: Get current BACS cycle
      tags: [BACS Cycles]
      responses:
        "200":
          description: Current cycle
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/payments/bacs/cycle/{cycleDate}:
    get:
      operationId: getBacsCycleByDate
      summary: Get BACS cycle by date
      tags: [BACS Cycles]
      parameters:
        - name: cycleDate
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cycle details
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/payments/bacs/cycle:
    get:
      operationId: listBacsCycles
      summary: List BACS cycles
      tags: [BACS Cycles]
      responses:
        "200":
          description: Cycle list

  /v1/payments/bacs/cycle/close:
    post:
      operationId: closeBacsInputDay
      summary: Close the current BACS input day
      description: Transitions cycle from OPEN to PROCESSING state.
      tags: [BACS Cycles]
      responses:
        "200":
          description: Cycle processing
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/payments/bacs/cycle/process:
    post:
      operationId: processBacsCycle
      summary: Process BACS cycle
      description: Transitions cycle from PROCESSING to AWAITING_SETTLEMENT.
      tags: [BACS Cycles]
      responses:
        "200":
          description: Cycle awaiting settlement

  /v1/payments/bacs/cycle/settle:
    post:
      operationId: settleBacsCycle
      summary: Settle the BACS cycle
      description: |
        Settles all transactions in the cycle.
        Publishes `cycle.settled` SSE events to each participant.
      tags: [BACS Cycles]
      responses:
        "200":
          description: Cycle settled

  # ─────────────────────────────────────────────
  # BACS — Mandates
  # ─────────────────────────────────────────────
  /v1/payments/bacs/mandates:
    post:
      operationId: createMandate
      summary: Create a BACS Direct Debit mandate (AUDDIS)
